---
# defaults file for smartgateway
size: 1
state: present
prometheus_scrape_interval: 1s
use_basic_auth: false
use_timestamp: true
tls_secret_name: elasticsearch-es-cert
exporter_host: 0.0.0.0
exporter_port: 8081
block_event_bus: false
service_account_name: smart-gateway
no_verbose_logs: true

# per-container resource limits, override via smart-gateway-resource-limits ConfigMap
sg_resource_defaults:
  oauth_proxy:
    cpu_limit: "1"
    memory_limit: "512Mi"
    cpu_request: "50m"
    memory_request: "64Mi"
  bridge:
    cpu_limit: "1"
    memory_limit: "1Gi"
    cpu_request: "100m"
    memory_request: "128Mi"
  sg_core:
    cpu_limit: "2"
    memory_limit: "8Gi"
    cpu_request: "300m"
    memory_request: "512Mi"

# used in conjunction with sg_vars in vars/main.yml to provide single parameter override for the dictionaries
sg_defaults:
  bridge:
    enabled: true
    amqp_url: "amqp://127.0.0.1:5672/collectd/telemetry"
    unix_socket_path: "/tmp"
    socket_block: true
    ring_buffer_count: 15000
    ring_buffer_size: 2048
    stats_period: 60
    stop_count: 0
    verbose: true
    amqp_block: false
