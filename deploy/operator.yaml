apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-gateway-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smart-gateway-operator
  template:
    metadata:
      labels:
        app: smart-gateway-operator
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: smart-gateway-operator
      automountServiceAccountToken: false
      containers:
      - name: operator
        image: <<OPERATOR_IMAGE_PULLSPEC>>
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          name: sa-token
          readOnly: true
        env:
        - name: ANSIBLE_LOCAL_TEMP
          value: /tmp/ansible-local
        - name: ANSIBLE_REMOTE_TEMP
          value: /tmp/ansible-local
        - name: WATCH_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: OPERATOR_NAME
          value: smart-gateway-operator
        - name: ANSIBLE_GATHERING
          value: explicit
        - name: ANSIBLE_VERBOSITY_SMARTGATEWAY_SMARTGATEWAY_INFRA_WATCH
          value: "2"
        - name: ANSIBLE_DEBUG_LOGS
          value: "False"
        - name: RELATED_IMAGE_CORE_SMARTGATEWAY_IMAGE
          value: <<RELATED_IMAGE_CORE_SMARTGATEWAY_PULLSPEC>>
        - name: RELATED_IMAGE_BRIDGE_SMARTGATEWAY_IMAGE
          value: <<RELATED_IMAGE_BRIDGE_SMARTGATEWAY_PULLSPEC>>
        - name: RELATED_IMAGE_OAUTH_PROXY_IMAGE
          value: <<RELATED_IMAGE_OAUTH_PROXY_PULLSPEC>>
      volumes:
      - emptyDir: {}
        name: tmp
      - name: sa-token
        projected:
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
          - downwardAPI:
              items:
              - path: namespace
                fieldRef:
                  fieldPath: metadata.namespace
